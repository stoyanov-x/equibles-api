# Deployed by Coolify as a compose application.
#
# Two external networks, each for exactly one reason:
#   equibles -> the Equibles app's own bridge network, named for its app uuid. The
#               `db` container already answers to the alias `db` there, which is how
#               this service reads the database WITHOUT the database being exposed
#               on any host port.
#   coolify  -> the shared network every Coolify app joins. meridian-core is on it,
#               so the alias below gives consumers a stable address that does not
#               depend on a generated container name.
services:
  api:
    build: .
    image: ghcr.io/stoyanov-x/equibles-api:latest
    restart: unless-stopped
    environment:
      EQUIBLES_DB_HOST: db
      EQUIBLES_DB_PORT: "5432"
      EQUIBLES_DB_NAME: equibles
      # The read-only role. Never `postgres`: this credential cannot write even if
      # the service is compromised, and that is the point of creating it.
      EQUIBLES_DB_USER: meridian_ro
      #
      # NOTE: the secrets are deliberately NOT declared here, and are NOT remapped
      # through `${VAR}` interpolation. Coolify injects the application's own
      # environment variables into every service, so the container reads them
      # directly. Using `${EQUIBLES_RO_PASSWORD:?...}` here looked safer and was a
      # bug: compose interpolates during the BUILD step, and Coolify passes only
      # *build-time* variables there, so a runtime-only secret fails the build
      # before the image exists. Marking the password build-time to work around
      # that would bake it into the image metadata.
      #
      # Set in Coolify: EQUIBLES_RO_PASSWORD (required), and optionally
      # EQUIBLES_API_KEY / EQUIBLES_API_MAX_ROWS.
    networks:
      equibles: {}
      coolify:
        aliases:
          - equibles-api
    expose:
      - "8080"
    # Uncomment for host-side debugging; not needed for Coolify routing.
    # ports:
    #   - "127.0.0.1:8083:8080"

networks:
  equibles:
    external: true
    name: lisfl00u818sk9dbws7psox1
  coolify:
    external: true
